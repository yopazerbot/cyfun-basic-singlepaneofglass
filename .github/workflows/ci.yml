name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cyfun-basic-spog:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: cyfun-basic-spog:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  install:
    # deploy/install.sh on a fresh Ubuntu runner: first install, then the update path and a backup.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/install.sh
      - name: First install
        run: |
          sudo CYFUN_REPO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" CYFUN_BRANCH="${{ github.head_ref || github.ref_name }}" \
            bash deploy/install.sh --yes
      - name: Update and backup
        run: |
          sudo cyfun-update
          sudo ls -l /srv/backups/cyfun
          sudo test -s /opt/cyfun/cyfun-root-ca.crt
          systemctl list-timers cyfun-backup.timer --no-pager
