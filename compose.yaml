# Two containers: the application (never exposed directly) and Caddy as TLS reverse proxy.
# Copy .env.example to .env and fill it in before `docker compose up -d`.
services:
  app:
    build: .
    image: cyfun-basic-spog:latest
    container_name: cyfun-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      # X-Forwarded-For is trusted only from the internal network, where Caddy is the only other member.
      FORWARDED_ALLOW_IPS: ${CYFUN_SUBNET:-172.31.250.0/24}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    container_name: cyfun-caddy
    restart: unless-stopped
    # Only the two values the proxy needs; the application secrets in .env stay out of this container.
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:?set APP_HOSTNAME in .env}
      CADDY_TLS: ${CADDY_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: ${CYFUN_SUBNET:-172.31.250.0/24}
